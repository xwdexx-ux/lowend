<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lowend</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#000000" id="metaTheme">
<script>try{var _t=localStorage.getItem("lowend_theme");if(_t==="light"){document.documentElement.setAttribute("data-theme","light");document.getElementById("metaTheme").content="#ffffff"}var _l=localStorage.getItem("lowend_lang");document.documentElement.lang=_l==="ru"?"ru":"en"}catch(e){}</script>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="lowend">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--a:#fff;--b:#8a8a8a;--ink:#000;--text:#fff;--muted:#8a8a8a;--glass:#0d0d0d;--edge:#242424;--track:#2a2a2a;--thumb:#fff;--onA:#000;--playbg:#fff;--playfg:#000;--field:#000;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--text);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif;overflow-x:hidden}
.wrap{max-width:1000px;margin:0 auto;padding:28px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.logo{font:800 26px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.logo i{font-style:normal;color:var(--a)}
.grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.grid>*,.card{min-width:0}
@media(min-width:860px){.grid{grid-template-columns:420px minmax(0,1fr);align-items:start}}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:26px;padding:20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.cover{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:1;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 24px 60px #0007;transition:transform .08s linear;display:grid;place-items:center}
.cover img{width:100%;height:100%;object-fit:cover;display:none}
.cover.has img{display:block}
.cover span{font:800 90px "Bricolage Grotesque",sans-serif;opacity:.5}
.cover.has span{display:none}
canvas{width:100%;height:56px;display:block;margin:16px 0 4px}
.title{font:800 24px/1.15 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{color:var(--muted);font-size:14px}
.bar{display:flex;align-items:center;gap:14px;margin-top:12px}
.play{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:var(--playbg);color:var(--playfg);font-size:20px;cursor:pointer;transition:transform .12s}
.play:active{transform:scale(.94)}
.play:disabled{opacity:.35;cursor:not-allowed}
.time{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.seekbox{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--a) var(--p),var(--track) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--thumb);margin-top:-7px;box-shadow:0 2px 8px #0008}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:var(--track)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--a)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--thumb)}
input[type=range]:disabled{opacity:.4}
h2{font:800 18px "Bricolage Grotesque",sans-serif;margin-bottom:10px}
.src{display:flex;gap:8px}
.src input[type=text]{flex:1;min-width:0;background:var(--field);border:1px solid var(--edge);border-radius:14px;padding:12px 14px;color:var(--text);font:inherit}
.src input::placeholder{color:#a59cc488}
.btn{border:0;border-radius:14px;padding:12px 16px;font:600 15px "Instrument Sans",sans-serif;cursor:pointer;background:var(--a);color:var(--onA)}
.btn.ghost{background:var(--glass);border:1px solid var(--edge);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.drop{margin-top:10px;display:block;text-align:center;border:1.5px dashed var(--edge);border-radius:14px;padding:16px;color:var(--muted);cursor:pointer;transition:.15s}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--a);color:var(--text)}
.drop input{position:absolute;opacity:0;pointer-events:none}
.fx{margin-top:18px}
.ctl{padding:14px 0;border-top:1px solid var(--edge)}
.ctl:first-of-type{border-top:0;padding-top:0}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline}
.ctl label{font-weight:600}
.ctl output{font:800 34px "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--a)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--edge);background:var(--glass);color:var(--text);border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--a)}
.dl{width:100%;margin-top:18px;padding:16px;font-size:16px}
.status{min-height:22px;margin-top:10px;text-align:center;color:var(--muted);font-size:14px}
.note{margin-top:10px;font-size:13px;color:var(--muted)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.card{border-radius:18px;backdrop-filter:none;-webkit-backdrop-filter:none}
.cover{background:#000;box-shadow:none;border-radius:12px}
.cover span{opacity:1;color:#fff;width:52%;height:52%;display:block}
.item{display:flex;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--edge)}
.item:first-child{border-top:0}
.item .meta{flex:1;min-width:0}
.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--muted);font-size:13px}
.sm{padding:9px 13px;font-size:14px}
.chip[aria-pressed=true]{background:var(--a);color:var(--onA);border-color:transparent;font-weight:600}
#welcome{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 28%,#232323,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;transition:opacity .6s,visibility .6s}
#welcome.out{opacity:0;visibility:hidden}
.w-sub{color:var(--muted);letter-spacing:.35em;text-transform:uppercase;font-size:12px}
.w-logo{font:800 clamp(64px,22vw,150px)/1.05 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;margin-bottom:.2em;background:linear-gradient(180deg,#fff 0%,#a8a8a8 47%,#fff 50%,#4d4d4d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-box-reflect:below -.1em linear-gradient(transparent 38%,rgba(255,255,255,.3))}
.w-card{margin-top:30px;width:min(340px,100%);padding:18px;border-radius:22px;background:linear-gradient(135deg,#ffffff22,#ffffff08);border:1px solid #ffffff30;box-shadow:inset 0 1px 0 #ffffff45,0 20px 50px #000a;position:relative;overflow:hidden}
.w-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,#ffffff22 50%,transparent 65%);transform:translateX(-100%);animation:sheen 4s infinite}
@keyframes sheen{to{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){.w-card::after{animation:none}}
#nick{width:100%;background:#0006;border:1px solid var(--edge);border-radius:14px;padding:12px 14px;color:var(--text);font:inherit;text-align:center}
#notice{position:fixed;top:12px;left:12px;right:12px;z-index:90;padding:14px 16px;border-radius:16px;background:var(--text);color:var(--ink);font-weight:600;box-shadow:0 10px 40px #000a;cursor:pointer}
#notice[hidden]{display:none}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--a);color:var(--onA);margin-left:6px;font-weight:600}

.av{width:36px;height:36px;border-radius:50%;background:#1a1a1a center/cover no-repeat;border:1px solid var(--edge);display:grid;place-items:center;font:800 15px "Bricolage Grotesque",sans-serif;color:var(--text);cursor:pointer;flex:none;padding:0}
.av.big{width:120px;height:120px;font-size:48px;margin:0 auto;cursor:default}
#profile{position:fixed;inset:0;z-index:95;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px}
#profile[hidden]{display:none}
#profile .btn{width:100%;margin-top:8px}

.langb{font-weight:700;letter-spacing:.04em;min-width:46px}
#langBtnW{position:absolute;top:14px;right:14px}
#welcome{position:fixed}
:root[data-theme=light]{--a:#000;--b:#555;--ink:#fff;--text:#000;--muted:#666;--glass:#f3f3f3;--edge:#dadada;--track:#d2d2d2;--thumb:#000;--onA:#fff;--playbg:#000;--playfg:#fff;--field:#fff;color-scheme:light}
[data-theme=light] .cover{background:#000}
[data-theme=light] .av{background:#e8e8e8}
[data-theme=light] .src input::placeholder,[data-theme=light] #nick::placeholder{color:#00000066}
[data-theme=light] #welcome{background:radial-gradient(ellipse at 50% 28%,#fff,#e4e4e4 70%)}
[data-theme=light] .w-logo{background:linear-gradient(180deg,#000 0%,#5a5a5a 47%,#000 50%,#b5b5b5 100%);-webkit-background-clip:text;background-clip:text}
[data-theme=light] .w-card{background:linear-gradient(135deg,#00000012,#00000005);border-color:#00000026;box-shadow:inset 0 1px 0 #fff,0 20px 50px #0002}
[data-theme=light] .w-card::after{background:linear-gradient(110deg,transparent 35%,#ffffff99 50%,transparent 65%)}
[data-theme=light] #nick{background:#fff}
[data-theme=light] input[type=range]::-webkit-slider-thumb{box-shadow:0 2px 8px #0004}
[data-theme=light] .cover{box-shadow:none}

.ctls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctls .ctl,.ctls .ctl:first-of-type{border:1px solid var(--edge);border-radius:16px;padding:12px 14px 6px}
.ctls .ctl.full{grid-column:1/-1}
.ctls .ctl .top{flex-direction:column;align-items:flex-start;gap:0}
.ctls .ctl.full .top{flex-direction:row;align-items:baseline;justify-content:space-between}
.ctls .ctl label{font-size:14px;color:var(--muted)}
.ctls .ctl output{font-size:26px;white-space:nowrap}
.ctls .ctl.full output{font-size:34px}
.ctls input[type=range]{height:44px}
.ctls input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:12px}
.ctls input[type=range]::-webkit-slider-thumb{width:30px;height:30px;margin-top:-9px}
.ctls input[type=range]::-moz-range-track,.ctls input[type=range]::-moz-range-progress{height:12px;border-radius:12px}
.ctls input[type=range]::-moz-range-thumb{width:30px;height:30px}
.pdemo{aspect-ratio:16/9;background:#000;border-radius:12px;position:relative;overflow:hidden;margin:12px 0;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font:300 clamp(13px,3.8vw,18px)/1.05 -apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.02em}
.pdemo i{position:absolute;left:0;bottom:0;height:3px;width:42%;background:#fff}
.plist{margin:8px 0 12px 18px;color:var(--muted);font-size:14px}
.plist li{margin-top:4px}
.alink{display:block;text-align:center;text-decoration:none}
.alink[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">lowend</div><div style="display:flex;align-items:center;gap:12px"><span class="hint" id="online"></span><button class="btn ghost sm langb" id="langBtn">RU</button><button class="av" id="avBtn" data-aria="profile" aria-label="Profile"></button></div></header>

  <div class="grid">
    <section class="card" aria-label="Плеер">
      <div class="cover" id="cover"><span><svg viewBox="0 0 64 64" width="100%" height="100%" fill="currentColor" aria-hidden="true"><rect x="1.5" y="26.0" width="5" height="12" rx="2.5"/><rect x="8.5" y="21.0" width="5" height="22" rx="2.5"/><rect x="15.5" y="16.0" width="5" height="32" rx="2.5"/><rect x="22.5" y="11.0" width="5" height="42" rx="2.5"/><rect x="29.5" y="4.0" width="5" height="56" rx="2.5"/><rect x="36.5" y="11.0" width="5" height="42" rx="2.5"/><rect x="43.5" y="16.0" width="5" height="32" rx="2.5"/><rect x="50.5" y="21.0" width="5" height="22" rx="2.5"/><rect x="57.5" y="26.0" width="5" height="12" rx="2.5"/></svg></span><img id="coverImg" alt=""></div>
      <canvas id="viz" width="400" height="56" aria-hidden="true"></canvas>
      <div class="title" id="name"></div>
      <div class="hint" id="sub"></div>
      <div class="bar">
        <button class="play" id="play" disabled data-aria="play" aria-label="Play">▶</button>
        <div class="seekbox">
          <input type="range" id="seek" min="0" max="1000" value="0" disabled data-aria="seek" aria-label="Seek">
          <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        </div>
      </div>
      <p class="hint" style="margin-top:12px" data-i="nosound"></p>
    </section>

    <div>
      <section class="card" aria-label="Поиск" style="margin-bottom:18px">
        <h2 data-i="searchH"></h2>
        <div class="src"><input type="text" id="q" maxlength="100" data-ph="searchPh" placeholder="Title or artist" autocomplete="off"><button class="btn" id="qBtn" data-i="find"></button></div>
        <p class="hint" style="margin-top:8px" data-i="searchHint"></p>
        <div id="found"></div>
        <p class="status" id="qStatus" role="status"></p>
      </section>

      <section class="card" aria-label="Источник">
        <h2 data-i="h1"></h2>
        <label class="drop" id="drop">
          <input type="file" id="file">
          <span data-i="drop"></span>
        </label>
      </section>

      <section class="card fx" aria-label="Эффекты">
        <h2 data-i="h2"></h2>
        <div class="chips">
          <button class="chip" data-p="speed=0.85">Slowed</button>
          <button class="chip" data-p="speed=1.25">Speed up</button>
          <button class="chip" data-p="bass=14">Bass boost</button>
          <button class="chip" data-p="reverb=40">Reverb</button>
          <button class="chip" data-p="pan=70">8D</button>
          <button class="chip" data-p="vol=170" data-i="chipLoud"></button>
          <button class="chip" data-p="echo=35" data-i="chipEcho"></button>
          <button class="chip" data-p="muffle=60" data-i="chipWater"></button>
          <button class="chip" data-reset data-i="chipReset"></button>
        </div>
        <div style="height:16px"></div>
        <div class="ctls">
<div class="ctl full"><div class="top"><label for="speed" data-i="lSpeed"></label><output id="speedO">1.00x</output></div>
          <input type="range" id="speed" min="0.3" max="2" step="0.01" value="1"></div>
<div class="ctl full"><div class="top"><label for="bass" data-i="lBass"></label><output id="bassO">+0 dB</output></div>
          <input type="range" id="bass" min="0" max="40" step="1" value="0"></div>
<div class="ctl"><div class="top"><label for="vol" data-i="lVol"></label><output id="volO">0</output></div>
          <input type="range" id="vol" min="0" max="400" step="1" value="100"></div>
<div class="ctl"><div class="top"><label for="treble" data-i="lTreble"></label><output id="trebleO">0</output></div>
          <input type="range" id="treble" min="0" max="20" step="1" value="0"></div>
<div class="ctl"><div class="top"><label for="reverb" data-i="lReverb"></label><output id="reverbO">0%</output></div>
          <input type="range" id="reverb" min="0" max="100" step="1" value="0"></div>
<div class="ctl"><div class="top"><label for="echo" data-i="lEcho"></label><output id="echoO">0</output></div>
          <input type="range" id="echo" min="0" max="100" step="1" value="0"></div>
<div class="ctl"><div class="top"><label for="pan" data-i="lPan"></label><output id="panO">0%</output></div>
          <input type="range" id="pan" min="0" max="100" step="1" value="0"></div>
<div class="ctl"><div class="top"><label for="muffle" data-i="lMuffle"></label><output id="muffleO">0</output></div>
          <input type="range" id="muffle" min="0" max="100" step="1" value="0"></div>
</div>
        <button class="btn dl" id="dl" disabled data-i="dlWav"></button>
        <button class="btn ghost dl" id="save" disabled style="margin-top:10px" data-i="saveLib"></button>
        <p class="status" id="status" role="status"></p>
      </section>

      <section class="card fx" aria-label="Библиотека">
        <h2 data-i="h3"></h2>
        <div id="lib"></div>
        <p class="hint" id="libEmpty" data-i="libEmpty"></p>
      </section>

      <section class="card fx" id="admin" hidden aria-label="Админ-панель">
        <h2 data-i="adminH"></h2>
        <p class="hint" id="adminInfo"></p>
        <button class="btn" id="studioBtn" style="width:100%;margin:6px 0 12px" data-i="studioBtn"></button>
        <div id="users"></div>
        <div class="src" style="margin-top:12px"><input type="text" id="noticeText" maxlength="200" data-ph="noticePh" placeholder="Message to everyone"><button class="btn ghost sm" id="noticeBtn" data-i="send"></button></div>
      </section>
      <section class="card fx" id="premCard" aria-label="Premium">
        <h2 data-i="premH"></h2>
        <p class="hint" id="premState"></p>
        <div class="pdemo"><span>lowend<br>your text here</span><i></i></div>
        <p class="hint" data-i="premWhat"></p>
        <ul class="plist"><li data-i="premL1"></li><li data-i="premL2"></li><li data-i="premL3"></li><li data-i="premL4"></li></ul>
        <button class="btn" id="premBuy" style="width:100%"></button>
        <a class="btn ghost alink" id="premLink" hidden target="_blank" rel="noopener" style="margin-top:8px" data-i="premOpenBot"></a>
        <button class="btn ghost" id="premStudio" hidden style="width:100%;margin-top:8px" data-i="studioBtn"></button>
        <p class="status" id="premStatus" role="status"></p>
      </section>
      <section class="card fx" id="appCard" hidden aria-label="Приложение">
        <h2 data-i="appH"></h2>
        <p class="hint" id="appHint" data-i="appHint"></p>
        <button class="btn" id="installBtn2" style="width:100%;margin-top:12px" data-i="appBtn"></button>
      </section>
      <p class="hint" style="text-align:center;margin-top:22px"><a href="#" id="nickLink" style="color:inherit" data-i="changeNick"></a> · <a href="#" id="logoutLink" style="color:inherit" data-i="logout"></a></p>
      <p class="hint" style="text-align:center;margin-top:10px"><a href="#" id="ownerLink" style="color:inherit" data-i="ownerLogin"></a></p>
    </div>
  </div>
</div>

<div id="notice" hidden></div>

<div id="profile" hidden>
  <div class="card" style="width:min(340px,100%);text-align:center">
    <div class="av big" id="pAv"></div>
    <div class="title" id="pName" style="text-align:center;margin-top:14px"></div>
    <div class="hint" id="pRole"></div>
    <input type="file" id="avFile" accept="image/*" hidden>
    <button class="btn" id="avPick" style="margin-top:16px" data-i="pPhoto"></button>
    <button class="btn ghost" id="avDel" data-i="pPhotoDel"></button>
    <button class="btn ghost" id="pNick" data-i="pNick"></button>
    <button class="btn ghost" id="pTheme"></button>
    <button class="btn ghost" id="pOut" data-i="pOut"></button>
    <button class="btn ghost" id="pClose" data-i="pClose"></button>
  </div>
</div>

<div id="welcome">
  <button class="btn ghost sm langb" id="langBtnW">RU</button>
  <div class="w-sub" data-i="welcome"></div>
  <div class="w-logo">lowend</div>
  <div class="w-card">
    <input type="text" id="nick" maxlength="20" data-ph="nickPh" placeholder="Your nickname (optional)" autocomplete="off">
    <button class="btn" id="enter" style="width:100%;margin-top:10px" data-i="enter"></button>
    <button class="btn ghost" id="installBtn" hidden style="width:100%;margin-top:8px" data-i="install"></button>
    <p class="hint" id="installHint" hidden style="margin-top:10px" data-i="installHint"></p>
    <p class="hint" id="onlineW" style="margin-top:10px"></p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- язык и тема ---------- */
const LANG = {
ru: {
  pick:'Выбери трек', pickSub:'Загрузи песню ниже', len:'Длина: ', nosound:'Нет звука? Проверь громкость и переключатель «без звука» сбоку телефона.',
  searchH:'Поиск треков', searchPh:'Название или исполнитель', find:'Найти', searchHint:'Находит 30-секундные превью. Полный трек загрузи сам ниже.',

      const r = await fetch('/studio.js', { headers: { 'x-token': tok } });
      if (!r.ok) throw 0;
      const el = document.createElement('script'); el.textContent = await r.text(); document.head.append(el);
    }
    window.openStudio();
  } catch (e) { showNotice(t('studioOnly')); }
};
$('pTheme').onclick = () => { theme = theme === 'light' ? 'dark' : 'light'; try { localStorage.setItem('lowend_theme', theme); } catch (e) {} applyTheme(); };
$('langBtn').onclick = toggleLang; $('langBtnW').onclick = toggleLang;
applyLang();
connect();
</script>
</body>
